version: 2

models:
  - name: dim_customers
    description: One row per unique Olist customer.
    columns:
      - name: customer_unique_id
        description: Unique identifier representing a customer across orders.
        data_tests:
          - not_null
          - unique

  - name: dim_products
    description: One row per product.
    columns:
      - name: product_id
        description: Unique product identifier.
        data_tests:
          - not_null
          - unique

  - name: dim_sellers
    description: One row per seller.
    columns:
      - name: seller_id
        description: Unique seller identifier.
        data_tests:
          - not_null
          - unique

  - name: fct_orders
    description: One row per order containing commercial, delivery, payment, review, and ingestion metrics.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_unique_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - delivered
                  - shipped
                  - canceled
                  - unavailable
                  - invoiced
                  - processing
                  - created
                  - approved
      - name: record_loaded_at
        data_tests:
          - not_null

  - name: fct_order_items
    description: One row per order item linking orders to customer, product, and seller dimensions.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: order_item_id
        data_tests:
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: price
        data_tests:
          - not_null
      - name: freight_value
        data_tests:
          - not_null
      - name: total_item_value
        data_tests:
          - not_null
      - name: record_loaded_at
        data_tests:
          - not_null
